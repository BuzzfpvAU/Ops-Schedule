<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Add your tags</title>
<style>
  :root { --bg: #f6f7f9; --card: #fff; --text: #16181d; --dim: #5b6270; --line: #dfe2e8; --accent: #3b5bdb; --danger: #c92a2a; --ok: #2b8a3e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111317; --card: #1a1d23; --text: #eceef2; --dim: #9aa1ad; --line: #2c3038; --accent: #748ffc; --danger: #ff8787; --ok: #69db7c; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  main { max-width: 440px; margin: 0 auto; padding: 24px 16px 48px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
  h1 { font-size: 21px; margin: 0 0 10px; }
  p, li { color: var(--dim); }
  ul { padding-left: 20px; margin: 10px 0 16px; }
  label { display: block; font-weight: 600; margin: 14px 0 6px; }
  input[type=email], input[type=password], input[type=text] { width: 100%; font-size: 17px; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--text); }
  a.button { display: block; box-sizing: border-box; text-align: center; text-decoration: none; }
  button, a.button { width: 100%; font-size: 17px; font-weight: 600; padding: 13px; margin-top: 12px; border: 0; border-radius: 10px; background: var(--accent); color: #fff; }
  button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--line); }
  button:disabled { opacity: .55; }
  .msg { color: var(--danger); margin: 8px 0 0; }
  .ok { color: var(--ok); }
  .item { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
  .item input { width: 22px; height: 22px; }
  .item span.n { flex: 1; color: var(--text); }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--dim); margin: 18px 0 4px; }
  .cancel { display: block; text-align: center; margin-top: 16px; color: var(--dim); font-size: 14px; }
  .steps { color: var(--dim); font-size: 13px; text-align: center; margin-bottom: 10px; }
</style>
</head>
<body>
<main>
  <div class="steps" id="steps"></div>
  <div class="card" id="app">Loading…</div>
</main>
<script>
const $app = document.getElementById('app');
let state = { step: 'loading' };
let busy = false;

const ERRORS = {
  bad_password: "Apple didn't accept that password.",
  bad_code: "That code didn't work.",
  hardware_key: "This Apple ID uses a security key, which this can't work with — ask the office.",
  apple_unavailable: "Apple isn't responding — try again in 15 minutes.",
  no_bottles: "Turn on iCloud Keychain on an iPhone that has a passcode, then try again.",
  no_items: "No tags found on this Apple ID.",
  timeout: "This took too long, so we stopped.",
  cancelled: "Cancelled.",
};

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

async function call(path, body) {
  busy = true; render();
  try {
    const r = await fetch(path, body === undefined ? {} : {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
    });
    state = r.status === 403 ? { step: 'expired' } : await r.json();
  } catch {
    state = { ...state, message: 'Connection problem — check your signal and try again.' };
  } finally {
    busy = false; render();
  }
}

const btn = (label, attrs = '') => `<button ${attrs} ${busy ? 'disabled' : ''}>${busy ? 'Working… (this can take 30 seconds)' : esc(label)}</button>`;
const cancelLink = '<a href="#" class="cancel" data-act="cancel">Cancel</a>';
const msg = () => (state.message ? `<p class="msg">${esc(state.message)}</p>` : '');
const removeLine = () => (state.remove_device
  ? `<p>On your iPhone: <strong>Settings → your name</strong>, scroll to your devices and remove <strong>${esc(state.remove_device)}</strong>.</p>` : '');

const SCREENS = {
  loading: () => 'Loading…',
  expired: () => `<h1>Link expired</h1><p>This link has expired or was already used. Ask the office for a new one.</p>`,
  unavailable: () => `<h1>Can't check your link right now</h1>
    <p>The office system didn't answer. Your link is still fine — try again in a minute.</p>
    ${state.retry ? `<a class="button" href="${esc(state.retry)}">Try again</a>` : '<p>Open the link from your message again.</p>'}`,
  intro: () => `<h1>Add your tags</h1>
    <p>This adds your Find My tags to the company equipment tracker${state.label ? ` (for <strong>${esc(state.label)}</strong>)` : ''}.</p>
    <ul>
      <li>Apple will tell you <strong>a new Mac signed in</strong>. That's expected.</li>
      <li>You'll be asked for your <strong>iPhone passcode</strong> so your tag keys can be read from iCloud Keychain.</li>
      <li>You choose which tags to share. <strong>Everything else is deleted straight after.</strong></li>
    </ul>
    <form data-act="start"><label for="email">Apple ID email</label>
    <input id="email" type="email" autocomplete="username" required>${msg()}${btn('Start')}</form>`,
  busy: () => `<h1>Please wait</h1><p>Someone else is adding tags right now. Try again in a few minutes.</p>${btn('Try again', 'data-act="retry"')}`,
  need_password: () => `<h1>Apple ID password</h1><form data-act="answer">
    <input type="password" autocomplete="current-password" required aria-label="Apple ID password">${msg()}${btn('Continue')}</form>${cancelLink}`,
  need_2fa_method: () => `<h1>Where should Apple send the code?</h1>
    ${(state.options || []).map((o) => btn(o.label, `data-act="pick" data-v="${o.index}"`)).join('')}${cancelLink}`,
  need_code: () => `<h1>Enter the 6-digit code</h1><form data-act="answer">
    <input type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]*" required aria-label="Code">${msg()}${btn('Continue')}</form>${cancelLink}`,
  need_bottle: () => `<h1>Which device's passcode do you know?</h1>
    ${(state.options || []).map((o) => btn(o.label, `data-act="pick" data-v="${o.index}"`)).join('')}${cancelLink}`,
  need_passcode: () => `<h1>Passcode for ${esc(state.device)}</h1>
    <p>This unlocks your tag keys in iCloud Keychain. It isn't stored anywhere.</p>
    <form data-act="answer"><input type="password" inputmode="numeric" autocomplete="off" required aria-label="Device passcode">${msg()}${btn('Continue')}</form>${cancelLink}`,
  choose: () => {
    const items = state.items || [];
    const row = (i) => `<label class="item"><input type="checkbox" value="${esc(i.file)}" ${i.checked ? 'checked' : ''}>
      <span>${esc(i.emoji || (i.kind === 'device' ? '📱' : '🏷'))}</span><span class="n">${esc(i.name)}</span></label>`;
    const tags = items.filter((i) => i.kind !== 'device');
    const devs = items.filter((i) => i.kind === 'device');
    return `<h1>Choose what to share</h1><p>Only ticked items are kept. Everything else is deleted now.</p>
      <form data-act="save">${tags.length ? '<h2>Tags</h2>' + tags.map(row).join('') : ''}
      ${devs.length ? '<h2>Your devices</h2>' + devs.map(row).join('') : ''}${btn('Save')}</form>${cancelLink}`;
  },
  done: () => `<h1 class="ok">Done</h1><p>${state.saved} tag${state.saved === 1 ? '' : 's'} added. The office will link ${state.saved === 1 ? 'it' : 'them'} to equipment.</p>${removeLine()}`,
  error: () => `<h1>That didn't work</h1><p>${esc(ERRORS[state.error] || 'Something went wrong — ask the office.')}</p>${removeLine()}
    ${state.error !== 'no_items' ? '<p>Open your link again to retry.</p>' : ''}`,
};

const ORDER = ['intro', 'need_password', 'need_2fa_method', 'need_code', 'need_bottle', 'need_passcode', 'choose', 'done'];

function render() {
  const screen = SCREENS[state.step] || SCREENS.error;
  $app.innerHTML = screen();
  const n = ORDER.indexOf(state.step);
  document.getElementById('steps').textContent = n > 0 && n < ORDER.length - 1 ? `Step ${n} of ${ORDER.length - 2}` : '';
  const first = $app.querySelector('input:not([type=checkbox])');
  if (first && !busy) first.focus();
}

$app.addEventListener('submit', (e) => {
  e.preventDefault();
  if (busy) return;
  const f = e.target;
  const act = f.dataset.act;
  if (act === 'start') call('/api/start', { email: f.querySelector('input').value });
  if (act === 'answer') {
    const v = f.querySelector('input').value;
    f.querySelector('input').value = '';
    call('/api/answer', { value: v });
  }
  if (act === 'save') call('/api/save', { files: [...f.querySelectorAll('input:checked')].map((i) => i.value) });
});

$app.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el || busy || el.tagName === 'FORM') return;
  const act = el.dataset.act;
  if (act === 'pick') call('/api/answer', { value: el.dataset.v });
  if (act === 'retry') call('/api/state');
  if (act === 'cancel') { e.preventDefault(); if (confirm('Cancel adding tags?')) call('/api/cancel', {}); }
});

if (location.search.includes('unavailable')) {
  const token = location.hash.slice(1);
  state = { step: 'unavailable', retry: /^[\w-]+$/.test(token) ? `/i/${token}` : null };
  history.replaceState(null, '', '/');
  render();
} else if (location.search.includes('expired')) { state = { step: 'expired' }; render(); } else { call('/api/state'); }
</script>
</body>
</html>
